<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>To Do list</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" onload="loadData()">

<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">

            <h3 class="text-center mb-3">Mani darbi</h3>

            <!-- PIEVIENOTS: prioritāte -->
            <select id="priority" class="form-select mb-2">
                <option value="danger">Svarīgi</option>
                <option value="warning" selected>Vidēji</option>
                <option value="success">Zema</option>
            </select>

            <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control">
                <button class="btn btn-primary" onclick="addTask()">Pievienot</button>
            </div>

            <ul id="task-list" class="list-group"></ul>

        </div>
    </div>  
</div>

<script>
    
    function addTask() {
        let input = document.getElementById("taskInput");
        let text = input.value;

        if (text === "") return;

        let priority = document.getElementById("priority").value;

        let li = document.createElement("li");
        li.className = "list-group-item";

li.innerHTML = `
    <div class="d-flex align-items-center flex-grow-1">
        <span class="badge bg-${priority} me-2">${priorityText(priority)}</span>
        <span class="task-text ${isDone ? 'done' : ''} task-item" onclick="toggleTask(this)">${text}</span>
    </div>
    <div>
        <button class="btn btn-sm btn-outline-info me-1" onclick="editTask(this)">Labot</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(this)">Dzēst</button>
    </div>
`;

        document.getElementById("task-list").appendChild(li);
        input.value = "";

        saveData();
    }

    

function toggleDone(element) {
    // 'element' tagad ir pats <span class="task-text">
    element.classList.toggle("text-decoration-line-through");
    saveData();
}
    function deleteTask(btn) {
        btn.parentElement.remove();
        saveData();
    }

    function priorityText(value) {
        if (value === "danger") return "Svarīgi";
        if (value === "warning") return "Vidēji";
        return "Zema";
    }

    function saveData() {
 let tasks = [];
document.querySelectorAll(".task-row").forEach(row => {
    tasks.push({
        t: row.querySelector(".task-text").innerText,
        p: row.querySelector(".badge").classList[1].replace("bg-", ""),
        d: row.classList.contains("is-completed")
    });
});
localStorage.setItem("tasks_v3", JSON.stringify(tasks));
    }

    function loadData() {
        let data = localStorage.getItem("tasks");
        if (data) {
            document.getElementById("task-list").innerHTML = JSON.parse(data);
        }
    }
</script>

</body>
</html>
